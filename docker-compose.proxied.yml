# For servers that ALREADY have a reverse proxy (nginx/Apache/Caddy/Traefik) on
# 80/443. No Caddy here — the app is published only on 127.0.0.1:${WEB_PORT}, and
# your existing proxy forwards the domain to it (and handles TLS).
services:
  db:
    image: postgres:16-alpine
    container_name: psp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: psp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: psp_portal
    volumes:
      - psp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psp -d psp_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: psp-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      APP_BASE_URL: ${APP_BASE_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      RUN_SEED: ${RUN_SEED}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:3000" # localhost only; your proxy reaches it

volumes:
  psp_pgdata:
