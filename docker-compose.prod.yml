services:
  db:
    image: postgres:16-alpine
    container_name: psp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: psp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: psp_portal
    volumes:
      - psp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psp -d psp_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: psp-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      APP_BASE_URL: ${APP_BASE_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      RUN_SEED: ${RUN_SEED}
    expose:
      - "3000" # internal only; Caddy terminates TLS and proxies to it

  caddy:
    image: caddy:2-alpine
    container_name: psp-caddy
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  psp_pgdata:
  caddy_data:
  caddy_config:
